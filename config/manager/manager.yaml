apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeschedule-controller
  namespace: automation
  labels:
    app.kubernetes.io/name: nodeschedule
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nodeschedule
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodeschedule
    spec:
      serviceAccountName: nodeschedule-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/lannonbr/node-schedule:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_IMAGE
              value: node:24-alpine@sha256:50c8e8ca1d27439048670df5883f32d57cf81cff6233222c893fd0d9884cbd81
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
